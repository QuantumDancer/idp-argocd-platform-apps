apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dex
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
    - {{ required "hostname must be set" .Values.hostname }}

  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      # Matches dex.fullnameOverride; Dex serves HTTP on 5556 (TLS terminated at the Gateway).
      name: dex
      port: 5556
      weight: 1
