# Grafana<->Dex static client secret. Same Vault path the Grafana chart reads; the
# vault-backend ClusterSecretStore points at the environment's own Vault instance.
# Only the client-secret key is consumed here (injected as GRAFANA_CLIENT_SECRET).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth-credentials
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h0m0s"
  dataFrom:
  - extract:
      key: idp/platform/observability/grafana-oauth
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
