# Creates the service account and API token inside Grafana, and publishes the token to a
# Secret (spec.tokens[].secretName, key: token) that the MCP server consumes. Reconciled by
# the grafana-operator, so the token is re-minted automatically on every cluster rebuild —
# no manual step. Must share a namespace with the referenced Grafana instance.
#
# Gotcha (rebuilds with a surviving Grafana DB): the operator *creates* the Grafana SA and
# errors if one of this name already exists — `POST /serviceaccounts` returns 400 "service
# account already exists", the status condition goes ServiceAccountSynchronized=False
# (ApplyFailed), the token Secret is never (re)created, and the MCP pod is stuck in
# CreateContainerConfigError ("secret not found"). This bites when the k8s cluster is rebuilt
# but Grafana's backing database is reused/restored, so the CR is new but the in-Grafana SA
# is a leftover. Fix: delete the orphaned SA inside Grafana (Administration → Service accounts,
# or DELETE /api/serviceaccounts/{id}); the operator then recreates it and mints the token.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: {{ .Values.grafanaServiceAccount.name }}
  namespace: {{ .Release.Namespace }}
spec:
  instanceName: {{ .Values.grafanaServiceAccount.instanceName }}
  name: {{ .Values.grafanaServiceAccount.name }}
  role: {{ .Values.grafanaServiceAccount.role }}
  tokens:
    - name: {{ .Values.grafanaServiceAccount.tokenName }}
      secretName: {{ .Values.grafanaServiceAccount.tokenSecretName }}
