grafana:
  hostname: grafana-mcp.k8s.home.rottlr.de

gateway:
  name: external
  namespace: gateway

grafana-mcp:
  grafana:
    url: http://grafana-service.grafana.svc.cluster.local:3000

  envFrom:
    - secretRef:
        name: grafana-mcp-credentials

  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 128Mi
