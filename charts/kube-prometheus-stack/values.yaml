kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      # Configure Prometheus to ignore all ServiceMonitors/PodMonitors
      # Alloy will discover and scrape them instead via prometheusOperatorObjects
      # Using matchLabels with a label that will never exist ensures no objects are selected
      serviceMonitorSelector:
        matchLabels:
          non-existent-label: "never-matches"
      podMonitorSelector:
        matchLabels:
          non-existent-label: "never-matches"
      probeSelector:
        matchLabels:
          non-existent-label: "never-matches"
      scrapeConfigSelector:
        matchLabels:
          non-existent-label: "never-matches"
      serviceMonitorNamespaceSelector:
        matchLabels:
          non-existent-label: "never-matches"
      podMonitorNamespaceSelector:
        matchLabels:
          non-existent-label: "never-matches"
      probeNamespaceSelector:
        matchLabels:
          non-existent-label: "never-matches"
      scrapeConfigNamespaceSelector:
        matchLabels:
          non-existent-label: "never-matches"
      resources:
        requests:
          memory: "1Gi"
          cpu: "500m"
        limits:
          memory: "2Gi"
      retention: 7d
      # Enable remote write receiver for Alloy to send metrics
      enableRemoteWriteReceiver: true
      # StatefulSet PVCs are retained by default, which orphans the backing
      # volume on teardown (the PV outlives the CSI driver and becomes an
      # unattachable, billable EBS volume on AWS). Metrics are disposable;
      # delete the PVC with the StatefulSet so storage is reclaimed while the
      # CSI driver still exists.
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: Delete
        whenScaled: Retain
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 15Gi

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          memory: "128Mi"
          cpu: "50m"
        limits:
          memory: "256Mi"
      retention: 168h # retention should match '^(0|(([0-9]+)h)?(([0-9]+)m)?(([0-9]+)s)?(([0-9]+)ms)?)$'

  # Disable Grafana because it is deployed via GrafanaOperator in  ../grafana/
  grafana:
    enabled: false

  # Disable components that are not reachable by default in Talos Linux
  kubeControllerManager:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  kubeScheduler:
    enabled: false

  # Disable exporters (provided by k8s-monitoring)
  kubeStateMetrics:
    enabled: false
  nodeExporter:
    enabled: false

  # Disable default rules. Rules and alerts are provided by the mixins (see ../../mixins/README.md)
  defaultRules:
    create: false

  # Helm cannot upgrade CRDs, and ArgoCD's ServerSideApply diff validates each CR against the
  # *live* CRD schema. When a chart bump adds a field to a CR (e.g. spec.hostNetwork in v87)
  # before the CRD teaches that field, the diff fails and blocks the sync that would apply the
  # new CRD. This pre-upgrade hook Job applies the CRDs first, breaking that chicken-and-egg.
  # forceConflicts lets the Job take ownership of fields ArgoCD's field manager already holds.
  crds:
    upgradeJob:
      enabled: true
      forceConflicts: true

# Custom Gateway Configuration, since kube-prometheus-stack Helm chart does not support Gateway routes yet
gateway:
  name: external
  namespace: gateway
  hostnames:
    prometheus: prometheus.k8s.home.rottlr.de
    alertmanager: alertmanager.k8s.home.rottlr.de
