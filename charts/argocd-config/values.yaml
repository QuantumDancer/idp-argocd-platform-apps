# Gateway API configuration
gateway:
  name: external
  namespace: gateway

# ArgoCD configuration
argocd:
  hostname: argocd.k8s.home.rottlr.de
  serviceName: argocd-server
  # Both service ports target the same plaintext container port 8080
  # (server.insecure), but argocd-server's connection multiplexer requires
  # gRPC on HTTP/2 and everything else on HTTP/1.1 — plain h2c requests get
  # the connection reset. The HTTPRoute therefore targets port 80 (no
  # appProtocol -> HTTP/1.1) while the GRPCRoute targets port 443, which
  # declares appProtocol kubernetes.io/h2c (set via terraform-talos-cluster;
  # the argo-cd chart only supports appProtocol on the https port).
  servicePort: 80
  grpcServicePort: 443
  namespace: argocd

additionalRepoSecrets: true

backstage:
  repoURL: "" # Set in ../../apps/templates/argocd-config.yaml
crossplaneCompositions:
  repoURL: "" # Set in ../../apps/templates/argocd-config.yaml
userApps:
  repoURL: "" # Set in ../../apps/templates/argocd-config.yaml
