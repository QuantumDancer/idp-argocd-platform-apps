# https://grafana.com/docs/tempo/latest/setup/helm-chart/
tempo:
  tempo:
    storage:
      trace:
        backend: local
        local:
          path: /var/tempo/traces
        wal:
          path: /var/tempo/wal

    # Generates RED metrics (rate, errors, duration) from incoming traces and
    # remote-writes them to Prometheus. Required for Grafana Drilldown - Traces.
    metricsGenerator:
      enabled: true
      remoteWriteUrl: "http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/api/v1/write"
      processor:
        service_graphs:
          wait: 10s
          max_items: 10000
        span_metrics: {}
      storage:
        path: /var/tempo/wal/generator

    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi

  persistence:
    enabled: true
    size: 10Gi
