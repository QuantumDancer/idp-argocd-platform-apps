apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: {{ .Release.Namespace }}
  annotations:
    # Wave 2, after the Grafana instance (wave 1): the route's health check fails
    # until the operator-created grafana-service exists, which deadlocks the
    # initial sync on a fresh cluster if it lands before the instance.
    argocd.argoproj.io/sync-wave: "2"
spec:
  hostnames:
    - {{ .Values.grafana.hostname }}

  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}

  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ .Release.Name }}-service
      port: 3000
      weight: 1

