# https://grafana.github.io/grafana-operator/docs/examples/grafana/custom-images/readme/
# https://grafana.github.io/grafana-operator/docs/examples/grafana/multiple_replicas/readme/
# https://grafana.github.io/grafana-operator/docs/examples/grafana/credential_secret/readme/
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  annotations:
    # ArgoCD deletes resources in reverse sync-wave order and waits for each wave
    # to finish. Deleting this CR before the secrets (wave 0) lets grafana-operator
    # drain the Grafana deployment/service it owns before ArgoCD removes the rest
    # of the chart — otherwise the operator recreates those workloads mid-cascade
    # and the app deletion deadlocks. Dependents whose health requires a running
    # instance (datasources, HTTPRoute) sit at wave 2, or the initial sync on a
    # fresh cluster deadlocks the other way around.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    # This label enables automatic dashboard discovery
    # Any GrafanaDashboard CR with instanceSelector.matchLabels.dashboards: "grafana" will be loaded
    # GrafanaDashboards can contain inline JSON/Jsonnet or reference ConfigMaps via configMapRef
    dashboards: "grafana"
spec:
  # renovate: datasource=docker depName=grafana/grafana
  version: 13.1.1
  config:
    log:
      mode: "console"
    server:
      # OAuth redirect_uri is derived from root_url; required behind the TLS-terminating Gateway.
      root_url: {{ required "grafana.rootUrl must be set" .Values.grafana.rootUrl | quote }}
    database:
      type: "postgres"
      host: "grafana-database-cluster-rw.grafana-database.svc.cluster.local"
      name: "grafana"
      user: "$__env{GF_DATABASE_USERNAME}"
      password: "$__env{GF_DATABASE_PASSWORD}"
    {{- if .Values.grafana.auth.provider }}
    auth:
      # Hide the username/password form so only SSO is offered in the UI. The admin
      # account stays usable via API/CLI basic auth (auth.basic, enabled by default)
      # as a break-glass path and for the grafana-mcp service account.
      disable_login_form: {{ .Values.grafana.auth.disableLoginForm | quote }}
      oauth_auto_login: {{ .Values.grafana.auth.oauthAutoLogin | quote }}
    {{- if eq .Values.grafana.auth.provider "gitlab" }}
    auth.gitlab:
      enabled: "true"
      # Lets role_attribute_path promote users to server admin (GrafanaAdmin).
      allow_assign_grafana_admin: "true"
      # Deny users whose role_attribute_path evaluates to empty (no matching group).
      role_attribute_strict: "true"
      client_id: "$__env{GF_OAUTH_CLIENT_ID}"
      client_secret: "$__env{GF_OAUTH_CLIENT_SECRET}"
      scopes: {{ .Values.grafana.auth.gitlab.scopes | quote }}
      auth_url: {{ .Values.grafana.auth.gitlab.authUrl | quote }}
      token_url: {{ .Values.grafana.auth.gitlab.tokenUrl | quote }}
      api_url: {{ .Values.grafana.auth.gitlab.apiUrl | quote }}
      # Optional. Omitted entirely when unset, so that sign-in is gated by
      # role_attribute_path alone — an environment that grants every authenticated user a
      # default role must not also send an empty allowed_groups, which denies everyone.
      {{- with .Values.grafana.auth.gitlab.allowedGroups }}
      allowed_groups: {{ . | quote }}
      {{- end }}
      role_attribute_path: {{ .Values.grafana.auth.gitlab.roleAttributePath | quote }}
    {{- else if eq .Values.grafana.auth.provider "generic_oauth" }}
    auth.generic_oauth:
      enabled: "true"
      name: {{ .Values.grafana.auth.genericOauth.name | quote }}
      allow_assign_grafana_admin: "true"
      role_attribute_strict: "true"
      client_id: "$__env{GF_OAUTH_CLIENT_ID}"
      client_secret: "$__env{GF_OAUTH_CLIENT_SECRET}"
      scopes: {{ .Values.grafana.auth.genericOauth.scopes | quote }}
      auth_url: {{ .Values.grafana.auth.genericOauth.authUrl | quote }}
      token_url: {{ .Values.grafana.auth.genericOauth.tokenUrl | quote }}
      api_url: {{ .Values.grafana.auth.genericOauth.apiUrl | quote }}
      groups_attribute_path: {{ .Values.grafana.auth.genericOauth.groupsAttributePath | quote }}
      role_attribute_path: {{ .Values.grafana.auth.genericOauth.roleAttributePath | quote }}
    {{- end }}
    {{- end }}
    # unified_alerting:
    #   enabled: true
    #   ha_listen_address: "${POD_IP}:9094"
    #   ha_peers: "grafana-alerting:9094"
    #   ha_advertise_address: "${POD_IP}:9094"
    #   ha_peer_timeout: 15s
    #   ha_reconnect_timeout: 2m
  disableDefaultAdminSecret: true
  deployment:
    spec:
      replicas: 2
      template:
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      key: admin-user
                      name: grafana-admin-credentials
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: admin-password
                      name: grafana-admin-credentials
                - name: GF_DATABASE_USERNAME
                  valueFrom:
                    secretKeyRef:
                      key: username
                      name: grafana-database-credentials
                - name: GF_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      key: password
                      name: grafana-database-credentials
                {{- if .Values.grafana.auth.provider }}
                - name: GF_OAUTH_CLIENT_ID
                  valueFrom:
                    secretKeyRef:
                      key: client-id
                      name: grafana-oauth-credentials
                - name: GF_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      key: client-secret
                      name: grafana-oauth-credentials
                {{- end }}
              resources:
                limits:
                  memory: 512Mi
                requests:
                  cpu: 100m
                  memory: 256Mi
  # TODO: Not yet released, wait until next Helm chart version
  # https://grafana.github.io/grafana-operator/docs/examples/grafana/httproute/readme/
