{{- if .Values.graft.enabled }}
# Anthropic API key for grafana-llm-app, which Graft depends on for every model call.
# Homelab only so far, hence no environment-specific path — unlike the OAuth credentials,
# the AWS environment has no counterpart to point at yet.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-llm-credentials
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h0m0s"
  dataFrom:
  - extract:
      key: idp/platform/observability/grafana-llm
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
{{- end }}
