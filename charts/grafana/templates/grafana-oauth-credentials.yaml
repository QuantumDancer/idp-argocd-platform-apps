{{- if .Values.grafana.auth.provider }}
# OAuth client credentials for SSO.
# Homelab: the GitLab application's client id/secret.
# AWS: the Grafana<->Dex static client id/secret.
# The Vault path is identical across environments; the vault-backend ClusterSecretStore
# points at the environment's own Vault instance.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oauth-credentials
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h0m0s"
  dataFrom:
  - extract:
      key: idp/platform/observability/grafana-oauth
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
{{- end }}
