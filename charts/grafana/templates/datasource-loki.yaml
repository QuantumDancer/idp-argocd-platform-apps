apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: loki
  annotations:
    # Wave 2, after the Grafana instance (wave 1) — see datasource-prometheus.yaml.
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki-gateway.loki.svc.cluster.local
    jsonData:
      'maxLines': 1000
      'httpHeaderName1': "X-Scope-OrgID"
      derivedFields:
        # Extract trace_id from JSON log lines and link to Tempo.
        # Regex matches the JSON field: "trace_id":"<hex value>"
        - name: TraceID
          matcherRegex: '"trace_id":"([a-f0-9]+)"'
          url: "${__value.raw}"
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: "1"
