apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: alertmanager
  annotations:
    # Wave 2, after the Grafana instance (wave 1) — see datasource-prometheus.yaml.
    argocd.argoproj.io/sync-wave: "2"
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Alertmanager
    type: alertmanager
    access: proxy
    url: http://kube-prometheus-stack-alertmanager.kube-prometheus-stack.svc.cluster.local
    jsonData:
      'tlsSkipVerify': true
      'handleGrafanaManagedAlerts': true
      'implementation': 'prometheus'
