apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: tempo
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Tempo
    type: tempo
    access: proxy
    url: http://tempo.tempo.svc.cluster.local:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        # trace_id/span_id are Loki structured metadata (not labels), so label-based
        # filtering finds nothing. Use a pipeline filter query instead.
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service_name="${__tags["service.name"]}"} | trace_id="${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
