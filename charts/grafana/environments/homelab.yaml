grafana:
  hostname: grafana.k8s.home.rottlr.de
  rootUrl: https://grafana.k8s.home.rottlr.de

  auth:
    provider: gitlab
    gitlab:
      authUrl: https://gitlab.home.rottlr.de/oauth/authorize
      tokenUrl: https://gitlab.home.rottlr.de/oauth/token
      apiUrl: https://gitlab.home.rottlr.de/api/v4
      scopes: "openid email profile"
      # No allowedGroups: sign-in is deliberately open to every authenticated GitLab user,
      # who lands on Viewer and can read all dashboards. Write access is never granted by
      # org role — it comes solely from per-folder grants to Grafana teams, reconciled from
      # GitLab group membership by the grafana-team-sync CronJob. Keeping the group list out
      # of here is what lets a new team be onboarded by editing idp-argocd-user-apps alone.
      roleAttributePath: "contains(groups[*], 'idp/platform') && 'GrafanaAdmin' || 'Viewer'"

gateway:
  name: external
  namespace: gateway
