# Grafana admin credentials, reused for basic auth against the Grafana API. Grafana's SSO
# config hides the login form but keeps basic auth enabled precisely for service callers
# like this one (see the Grafana SSO section of the repository CLAUDE.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafana.credentialsSecret }}
  labels:
    {{- include "grafana-team-sync.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h0m0s"
  dataFrom:
  - extract:
      key: {{ .Values.grafana.vaultPath }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
