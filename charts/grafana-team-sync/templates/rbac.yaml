apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grafana-team-sync.fullname" . }}
  labels:
    {{- include "grafana-team-sync.labels" . | nindent 4 }}
---
# Cluster-scoped rather than a namespaced Role: the GrafanaFolder CRs this job discovers are
# rendered by idp-argocd-user-apps into its own namespace, while the job itself runs
# alongside Grafana. Read-only — folders are created and owned by grafana-operator.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "grafana-team-sync.fullname" . }}
  labels:
    {{- include "grafana-team-sync.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - grafana.integreatly.org
    resources:
      - grafanafolders
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "grafana-team-sync.fullname" . }}
  labels:
    {{- include "grafana-team-sync.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "grafana-team-sync.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grafana-team-sync.fullname" . }}
    namespace: {{ .Release.Namespace }}
