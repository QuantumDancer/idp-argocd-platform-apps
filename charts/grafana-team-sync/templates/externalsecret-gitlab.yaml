# GitLab group access token used to read group membership. Scoped to the `idp` group with
# the read_api scope only; see the chart README for how it is issued and rotated.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.gitlab.credentialsSecret }}
  labels:
    {{- include "grafana-team-sync.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h0m0s"
  dataFrom:
  - extract:
      key: {{ .Values.gitlab.vaultPath }}
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
