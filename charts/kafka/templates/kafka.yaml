apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: platform
  annotations:
    # KRaft mode with node pools: topology comes from the KafkaNodePool
    # (kafka-node-pool.yaml), not from spec.kafka.replicas/storage (which are
    # ignored in this mode).
    strimzi.io/kraft: enabled
    strimzi.io/node-pools: enabled
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    metadataVersion: {{ .Values.kafka.metadataVersion }}
    listeners:
      # Plaintext internal listener only — reachable in-cluster at
      # platform-kafka-bootstrap.kafka.svc.cluster.local:9092. No external/TLS
      # listener: the only client is tempo-distributed in the same cluster.
      - name: plain
        port: 9092
        type: internal
        tls: false
    # Places each partition replica in a different AZ by deriving broker.rack from
    # the node's zone label. Without it Strimzi spreads replicas across brokers
    # but is blind to zones, so all three copies of a partition can share one AZ.
    rack:
      topologyKey: topology.kubernetes.io/zone
    config:
      default.replication.factor: {{ .Values.kafka.replicationFactor }}
      min.insync.replicas: {{ .Values.kafka.minInsyncReplicas }}
      offsets.topic.replication.factor: {{ .Values.kafka.replicationFactor }}
      transaction.state.log.replication.factor: {{ .Values.kafka.replicationFactor }}
      transaction.state.log.min.isr: {{ .Values.kafka.minInsyncReplicas }}
      # Topics are declared as KafkaTopic CRs (kafka-topic.yaml), so broker-side
      # auto-creation is off. It was previously on, and its default partition
      # count was the only lever over tempo-traces' shape — Tempo's client-side
      # partition preference does not survive broker auto-creation under Strimzi,
      # which owns the broker config. That cost a rollout where the topic came up
      # with 1 partition and left the second block-builder/live-store of each pair
      # unassigned. Declaring the topic removes the guesswork entirely.
      auto.create.topics.enable: false
    template:
      podDisruptionBudget:
        # Already Strimzi's default; pinned because min.insync.replicas=2 makes it
        # load-bearing — draining a second broker stops writes — and a silent
        # upstream default change would be an outage rather than a regression.
        maxUnavailable: 1
  # The topic operator reconciles the KafkaTopic CRs in this chart. No
  # userOperator: the plaintext internal listener has no Kafka users to manage.
  entityOperator:
    topicOperator: {}
