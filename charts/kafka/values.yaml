# Platform Kafka cluster, managed by the Strimzi operator (charts/strimzi-kafka-operator).
# Named "platform" so the bootstrap service resolves to
# platform-kafka-bootstrap.kafka.svc.cluster.local:9092 (consumed by tempo-distributed).
kafka:
  # Kafka version and its KRaft metadata version must both be supported by the
  # pinned Strimzi release (1.1.0 supports 4.2.0/4.2.1/4.3.0; 4.3.0 is its default).
  version: 4.3.0
  metadataVersion: 4.3-IV0

  # Three dual-role (controller+broker) nodes: the smallest KRaft topology that
  # keeps a controller quorum after losing one node. The cluster is spot-only and
  # Karpenter consolidates every 2m, so node loss is routine rather than
  # exceptional. Kafka is only a transient trace buffer — durable data lands in
  # S3 via the Tempo block-builder — but a single broker still means trace ingest
  # stops outright until a replacement node is provisioned *and* its AZ-pinned
  # gp3 PVC reattaches, which is the failure this topology avoids.
  #
  # MIGRATION: growing this pool does NOT replicate topics that already exist.
  # Kafka never rebalances existing partitions onto new brokers, and Strimzi's
  # topic operator cannot raise an existing topic's replication factor without
  # Cruise Control (strimzi/proposals #066), which this chart does not deploy.
  # That applies to the internal __consumer_offsets too, which is created at
  # whatever the pool size was on first boot and cannot simply be deleted.
  # A cluster left in that state keeps every partition on broker 0, i.e. exactly
  # the single point of failure this topology is meant to remove.
  #
  # Because storage is deleteClaim: true and every topic here is a disposable
  # trace buffer, the supported migration is to delete the Kafka CR and let
  # ArgoCD recreate it, so all topics — internal ones included — are created
  # fresh against the 3-node pool. Verify afterwards that no topic reports all
  # replicas on one broker:
  #   kubectl -n kafka exec platform-dual-role-0 -c kafka -- \
  #     bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe
  #
  # The recreated topic gets a new Kafka topic ID, and Tempo's live-store caches
  # the old one: it then hot-loops on UNKNOWN_TOPIC_ID and consumes nothing,
  # while every other component recovers on its own via metadata refresh. Restart
  # it after any topic recreation, or trace ingest silently stays at zero:
  #   kubectl rollout restart statefulset/tempo-distributed-live-store -n tempo
  #
  # Deploy Cruise Control instead if this cluster ever holds data worth keeping.
  nodePool:
    replicas: 3
    storageSize: 10Gi

  # min.insync.replicas 2 (of 3) keeps writes durable against one node loss while
  # still accepting writes during it; 3 would stall ingest whenever any node is
  # being replaced, which on spot is most of the time.
  replicationFactor: 3
  minInsyncReplicas: 2

  # Topics are not declared here: this chart only provides the cluster, and
  # each consumer app owns its topics as cross-namespace KafkaTopic CRs (e.g.
  # charts/tempo-distributed/templates/kafka-topic.yaml). Consumer apps sit at
  # higher sync-waves than this one, which is what keeps the topic operator
  # alive to process KafkaTopic finalizers during the teardown cascade. Those
  # CRs omit replicas/min.insync.replicas, so the broker defaults above size
  # every consumer topic — changing them here changes new topics everywhere.
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 2Gi
