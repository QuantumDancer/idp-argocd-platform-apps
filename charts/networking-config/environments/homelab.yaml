# LoadBalancer IPs live on the node LAN (192.168.30.0/24), outside the Kea DHCP range, so they are
# reachable on-link via L2 announcements without any router involvement.
lbPool:
  enabled: true
  startIP: 192.168.30.110
  stopIP: 192.168.30.119

l2Announcements:
  enabled: true

# Pool allocation: .110 Gateway `external`, .111 garage-s3-lb (charts/garage/environments/homelab.yaml).
gatewayExternalIP: 192.168.30.110
