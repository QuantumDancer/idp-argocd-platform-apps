{{- if .Values.techdocsPublisher.enabled }}
# Access key of the TechDocs publisher (GitLab CI, `techdocs-cli publish`). Unlike the other
# keys here it is not generated by the garage-operator but imported: the ID and secret are
# created once by Terraform (`vault-secrets`) and stored in Vault, so the GitLab CI/CD
# variables set from them survive a cluster rebuild. A rebuilt Garage re-imports the very
# same key instead of minting a new one.
#
# Write access to the `techdocs` bucket is NOT granted here. A GarageBucket is authoritative
# over its grants (keys it does not list are revoked), and the one `techdocs` bucket is
# declared by idp-portal-deployment (templates/garage-bucket.yaml), so the grant for this
# key has to sit in that single resource:
#   grants:
#     - keyRef: {name: techdocs-publisher, namespace: garage}
#       read: true
#       write: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.techdocsPublisher.importSecretName }}
  annotations:
    # The key controller reads this Secret on its first reconcile.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: "1h0m0s"
  # Not the operator's output Secret: the operator owns that one and rewrites it.
  target:
    name: {{ .Values.techdocsPublisher.importSecretName }}
  dataFrom:
    - extract:
        # Properties accessKeyId / secretAccessKey are the garage-operator's import defaults.
        key: {{ .Values.techdocsPublisher.vaultKey }}
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: garage.rottler.io/v1alpha1
kind: GarageKey
metadata:
  name: techdocs-publisher
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  clusterRef:
    name: {{ include "garage.fullname" . }}
    namespace: {{ .Release.Namespace }}
  import:
    secretName: {{ .Values.techdocsPublisher.importSecretName }}
  permissions:
    createBucket: false
  # Delete (the default): the Vault copy is the source of truth, so removing the CR may
  # remove the key from Garage and a later re-apply simply imports it again.
  deletionPolicy: Delete
{{- end }}
