{{- if .Values.httproute.s3.api.enabled }}
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "garage.fullname" . }}-s3-api
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  hostnames:
  - {{ .Values.httproute.s3.api.hostname | quote }}
  # Virtual-hosted-style bucket access: <bucket>.s3.garage.k8s.home.rottlr.de
  - {{ printf "*.%s" .Values.httproute.s3.api.hostname | quote }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "garage.fullname" . }}
      port: {{ .Values.service.s3.api.port }}
      weight: 1
{{- end }}
---
{{- if .Values.httproute.s3.web.enabled }}
# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "garage.fullname" . }}-s3-web
  labels:
    {{- include "garage.labels" . | nindent 4 }}
spec:
  hostnames:
  - {{ .Values.httproute.s3.web.hostname | quote }}
  # Wildcard hostname for bucket-prefixed web access: <bucket>.web.garage.k8s.home.rottlr.de
  - {{ printf "*.%s" .Values.httproute.s3.web.hostname | quote }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name }}
    namespace: {{ .Values.gateway.namespace }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - group: ""
      kind: Service
      name: {{ include "garage.fullname" . }}
      port: {{ .Values.service.s3.web.port }}
      weight: 1
{{- end }}
