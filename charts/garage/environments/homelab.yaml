garageCluster:
  # Single node is enough for homelab purposes
  replicationFactor: 1
  nodePool:
    replicas: 1
    storage:
      data:
        size: 3Gi
        storageClass: longhorn
      meta:
        size: 512Mi
        storageClass: longhorn
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
  s3:
    api:
      rootDomain: ".s3.garage.k8s.home.rottlr.de"
  referencePolicy:
    # Backstage (ns: backstage) hosts the TechDocs GarageBucket/GarageKey.
    allowedNamespaces:
      - backstage
  metrics:
    enabled: true

httproute:
  s3:
    api:
      enabled: true
      hostname: s3.garage.k8s.home.rottlr.de

gateway:
  name: external
  namespace: gateway
