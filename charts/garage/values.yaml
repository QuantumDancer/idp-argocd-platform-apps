# Default values for the garage chart.
#
# This chart no longer deploys Garage directly. It declares an operator-managed
# GarageCluster (garage.rottler.io/v1alpha1) plus the Gateway API HTTPRoute that
# fronts its S3 API. The garage-operator owns the StatefulSet, Services, the admin
# and RPC secrets, and the metrics PodMonitor.

# -- Additional labels to add to all resources created by this chart
commonLabels: {}

garageCluster:
  # -- Replication factor. Immutable once the cluster is created.
  replicationFactor: 3

  # -- Garage image override. Leave both empty to use the operator's tested default.
  image:
    repository: ""
    tag: ""

  nodePool:
    name: default
    # -- Number of Garage nodes (StatefulSet replicas) in this pool.
    replicas: 3
    storage:
      data:
        size: 1Ti
        # -- Leave empty to use the cluster's default StorageClass.
        storageClass: ""
      meta:
        size: 5Gi
        storageClass: ""
    # -- Pod resource requests/limits for the Garage containers.
    resources: {}

  s3:
    api:
      region: garage
      # -- DNS suffix for virtual-hosted-style bucket access (e.g. ".s3.garage.tld").
      rootDomain: ""

  # -- Namespaces (besides the cluster's own) allowed to host GarageBucket / GarageKey
  # resources that reference this cluster. Empty list => only the cluster's namespace.
  referencePolicy:
    allowedNamespaces: []

  metrics:
    # -- If true, the operator creates a PodMonitor scraping the Garage metrics.
    enabled: false

service:
  s3:
    api:
      # -- Port the Garage S3 API listens on (fixed by the operator's Service).
      port: 3900
      # -- Dedicated LoadBalancer Service for the S3 API, bypassing the Gateway/Envoy
      # L7 proxy whose 1 MiB per-connection buffer stalls large uploads (cilium#43359).
      loadBalancer:
        enabled: false
        # -- IP requested from the Cilium LB-IPAM pool (io.cilium/lb-ipam-ips annotation).
        ip: ""
        # -- If set, external-dns publishes an A record for this hostname.
        # Requires the `service` source enabled in the external-dns chart.
        hostname: ""

# Gateway API HTTPRoute fronting the S3 API endpoint.
httproute:
  s3:
    api:
      # -- If true, an HTTPRoute is created for the S3 API endpoint.
      # Also creates a wildcard route for virtual-hosted-style bucket access (<bucket>.<hostname>).
      enabled: false
      hostname: "s3.garage.tld"

# -- Gateway to attach the HTTPRoute to. Required when httproute.s3.api.enabled is true.
gateway:
  name: ""
  namespace: ""
