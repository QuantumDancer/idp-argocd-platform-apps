cluster:
  type: postgresql
  mode: standalone
  version:
    # Must name the same major as `cluster.imageName`: the chart derives the
    # major from it for the PodMonitor queries and the image catalog.
    postgresql: "18"
  cluster:
    # Exact build pinned by tag and digest, not the moving major tag: with
    # `imagePullPolicy: IfNotPresent` a moving tag left nodes on a stale
    # Debian 11 build. `minimal` is enough, as the database uses the C locale
    # and no extensions beyond plpgsql. Changing the major here makes CNPG run
    # an offline in-place `pg_upgrade`, which cannot be rolled back once it
    # has succeeded.
    # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
    imageName: ghcr.io/cloudnative-pg/postgresql:18.7-202611201711-minimal-trixie@sha256:635bfde0a4ce2a04daad754e1ad37fb95ae096c8153b37fe1a4561b5ea417e38
    instances: 3
    storage:
      # 4Gi, not 2Gi: the database is ~1Gi, and a major-version `pg_upgrade`
      # may need a second copy of the data directory next to the first.
      size: 4Gi
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
    roles:
      - name: backstage
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: backstage-database-credentials
    initdb:
      database: backstage
      owner: backstage
      secret:
        name: backstage-database-credentials
  backups:
    enabled: false

# Set in ../../apps/templates/argocd-config.yaml
environment: ""
