cluster:
  type: postgresql
  mode: standalone
  version:
    postgresql: "16"
  cluster:
    instances: 3
    storage:
      # 4Gi, not 2Gi: the database is ~1Gi, and a major-version `pg_upgrade`
      # may need a second copy of the data directory next to the first.
      size: 4Gi
    monitoring:
      enabled: true
      podMonitor:
        enabled: true
    roles:
      - name: backstage
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: backstage-database-credentials
    initdb:
      database: backstage
      owner: backstage
      secret:
        name: backstage-database-credentials
  backups:
    enabled: false

# Set in ../../apps/templates/argocd-config.yaml
environment: ""
