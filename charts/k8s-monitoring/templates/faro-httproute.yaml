# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/gateway.networking.k8s.io/httproute_v1.json
# Publishes the Faro receiver (alloy-receiver collector, port .Values.global.faro.servicePort)
# on the external Gateway so browsers can post RUM telemetry. CORS/preflight is
# handled by the faro.receiver itself, so no Gateway-level CORS filter is required.
{{- with .Values.global.faro }}
{{- if .enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: faro-receiver
  namespace: {{ $.Release.Namespace }}
  annotations:
    # Wave 2, after the Alloy CRs (wave 1, set in values.yaml): the route's
    # health check fails until the alloy-receiver service exists, which
    # deadlocks the initial sync on a fresh cluster if it lands before them.
    argocd.argoproj.io/sync-wave: "2"
spec:
  hostnames:
    - {{ required "global.faro.hostname must be set when global.faro.enabled" .hostname }}

  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .gateway.name }}
      namespace: {{ .gateway.namespace }}

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service created by the Alloy operator for the alloy-receiver collector;
        # its name tracks the Alloy resource name (<release>-alloy-receiver).
        - group: ""
          kind: Service
          name: {{ $.Release.Name }}-alloy-receiver
          port: {{ .servicePort }}
          weight: 1
{{- end }}
{{- end }}
