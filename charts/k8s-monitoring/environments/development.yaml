# Faro receiver exposure for development SPAs (served under *.dev.idp.rottlr.de).
# FARO_URL → https://<hostname>/collect.
global:
  faro:
    hostname: faro.dev.idp.rottlr.de
    allowedOrigins:
      - "https://*.dev.idp.rottlr.de"

k8s-monitoring:
  cluster:
    name: development

  # AWS runs distributed Tempo, so traces go to its distributor. destinations is
  # a map, so this deep-merges onto the local-tempo entry in values.yaml — the
  # name stays "local-tempo", keeping the Faro local_tempo processor refs intact.
  destinations:
    local-tempo:
      url: http://tempo-distributed-distributor.tempo.svc.cluster.local:4317

  # Keep the logs DaemonSet off Fargate nodes; they have no host filesystem to
  # read logs from. The node-exporter telemetry service already excludes Fargate.
  collectors:
    alloy-logs:
      controller:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: eks.amazonaws.com/compute-type
                      operator: NotIn
                      values:
                        - fargate
