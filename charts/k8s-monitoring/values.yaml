# Grafana K8s Monitoring Chart Configuration
# This chart uses Grafana Alloy for unified observability (metrics, logs, traces)

# Configure with upstream k8s-monitoring chart values
k8s-monitoring:
  # Local destinations (Prometheus and Loki running in the cluster).
  destinations:
    local-prometheus:
      type: prometheus
      url: http://kube-prometheus-stack-prometheus.kube-prometheus-stack.svc.cluster.local:9090/api/v1/write
      # No auth required (yet)

    local-loki:
      type: loki
      url: http://loki-gateway.loki.svc.cluster.local/loki/api/v1/push
      tenantId: "1" # Loki multi-tenant org ID
      # No auth required (yet)

    local-tempo:
      type: otlp
      url: http://tempo.tempo.svc.cluster.local:4317
      protocol: grpc
      tls:
        insecure: true
      metrics:
        enabled: false
      logs:
        enabled: false
      traces:
        enabled: true

  # Collectors (Alloy instances). Every feature below is assigned to one of these.
  # The names must match the self-monitoring labelSelectors below and the
  # alloy-mixin dashboards/ServiceMonitor, which select by app.kubernetes.io/name.
  collectors:
    # Scrapes metrics; clustered for target sharing across replicas.
    alloy-metrics:
      presets:
        - clustered
        - statefulset
      alloy:
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi

    # Single-replica collector for cluster events.
    alloy-singleton:
      presets:
        - singleton
      alloy:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

    # DaemonSet reading pod and node logs from the host filesystem.
    alloy-logs:
      presets:
        - filesystem-log-reader
        - daemonset
      controller:
        priorityClassName: monitoring-daemonset
      alloy:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 512Mi

    # Deployment receiving OTLP traces and forwarding them to Tempo.
    alloy-receiver:
      presets:
        - deployment
      alloy:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 256Mi

  # Backing services scraped for cluster and host metrics. kepler, opencost and
  # windows-exporter stay off (chart default).
  telemetryServices:
    kube-state-metrics:
      deploy: true
    node-exporter:
      deploy: true
      priorityClassName: monitoring-daemonset

  # Kubernetes cluster metrics (kube-state-metrics, kubelet, cAdvisor).
  clusterMetrics:
    enabled: true
    collector: alloy-metrics

  # Host/node metrics (node-exporter). linuxHosts must be enabled explicitly;
  # hostMetrics.enabled alone renders an empty module that scrapes nothing.
  # labelMatchers/namespace auto-populate from the node-exporter deployed under
  # telemetryServices above.
  hostMetrics:
    enabled: true
    collector: alloy-metrics
    linuxHosts:
      enabled: true

  # Enables Alloy to discover and scrape ServiceMonitors, PodMonitors, and Probes.
  # Without this, no metrics from Prometheus Operator objects are collected. The
  # CRDs themselves are owned by kube-prometheus-stack (sync wave 1).
  prometheusOperatorObjects:
    enabled: true
    collector: alloy-metrics

  # Cluster events collection.
  clusterEvents:
    enabled: true
    collector: alloy-singleton

  # Node logs collection (journald).
  nodeLogs:
    enabled: true
    collector: alloy-logs

  # Pod logs collection via the Loki processing pipeline.
  podLogsViaLoki:
    enabled: true
    collector: alloy-logs
    extraLogProcessingStages: |-
      // Extract OTLP trace context from JSON-structured log lines.
      // stage.json is a no-op for non-JSON lines, so this is safe cluster-wide.
      stage.json {
        expressions = {
          trace_id = "trace_id",
          span_id  = "span_id",
        }
      }

      stage.structured_metadata {
        values = {
          trace_id = "",
          span_id  = "",
        }
      }

  # Application observability (OTLP receivers for traces) via alloy-receiver.
  applicationObservability:
    enabled: true
    collector: alloy-receiver
    receivers:
      otlp:
        grpc:
          enabled: true
        http:
          enabled: true

  # Alloy integrations (self-monitoring)
  integrations:
    collector: alloy-metrics
    alloy:
      instances:
        - name: alloy
          labelSelectors:
            app.kubernetes.io/name:
              - alloy-metrics
              - alloy-singleton
              - alloy-logs
              - alloy-receiver

alloy-mixin:
  grafanaDashboard:
    enabled: true
    folder: Observability
    grafanaOperator:
      enabled: true
  monitor:
    enabled: true
