trivy-operator:
  operator:
    # The nodes have ~10 GiB each and already run at 60-75% memory, and every scan
    # job pulls and unpacks a whole image. Two at a time keeps the initial sweep of
    # all workloads from crowding out real workloads; it just takes longer.
    scanJobsConcurrentLimit: 2

    # One in-cluster Trivy server holds the vulnerability DB, and scan jobs run as
    # thin clients against it. In the default Standalone mode every scan job
    # downloads the full DB itself, which on a first sweep of every image means
    # dozens of downloads and hits the registry rate limit.
    builtInTrivyServer: true

    # Infra assessment runs the node-collector with hostPath mounts of kubeadm-style
    # paths (/etc/kubernetes, /var/lib/etcd, systemd units). Talos has none of
    # these, so its CIS-style checks report nonsense, and the privileged pod would
    # need the namespace exempted from Pod Security. The cluster compliance reports
    # build on those node reports, so they go too.
    infraAssessmentScannerEnabled: false
    clusterComplianceEnabled: false

    # The operator caches every SbomReport in memory, and on startup it lists them
    # all at once. 121 reports came to ~71 MB of JSON, which OOM-killed the operator
    # at its 512Mi limit on every restart. Nothing here consumes SBOMs; the only
    # in-operator user is ClusterVulnerabilityReports, which were never produced.
    # Vulnerability reports do not depend on this.
    sbomGenerationEnabled: false

    # Exports one `trivy_vulnerability_id` series per CVE per container, which the
    # dashboard's CVE table is built on. Upstream warns about cardinality; for a
    # cluster this size it is tens of thousands of series at most.
    metricsVulnIdEnabled: true

  # Scraped by Alloy (k8s-monitoring prometheusOperatorObjects), not Prometheus.
  serviceMonitor:
    enabled: true

  # Pod Security "restricted": the upstream defaults already drop capabilities and
  # block privilege escalation, but none of the three pod kinds (operator, scan
  # jobs, Trivy server) set `runAsNonRoot` or a seccomp profile, so the API server
  # warns on every scan job. Helm deep-merges these maps into the upstream
  # defaults, so only the missing keys are listed.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  trivyOperator:
    # Scan jobs run in `image` mode, which pulls layers over the network and needs
    # no root. Switching `trivy.command` to filesystem/rootfs would need
    # `runAsUser: 0` here, and that is no longer "restricted"-compliant.
    scanJobPodTemplatePodSecurityContext:
      runAsUser: 10000
      runAsGroup: 10000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    scanJobPodTemplateContainerSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  trivy:
    # The server's DB is a cache that Trivy re-downloads on start, so an emptyDir
    # is enough; a Longhorn PVC would replicate it three times for nothing.
    storageClassEnabled: false

    # Scan job containers. The upstream chart ships CPU limits; null them out
    # (Helm deletes null keys on merge) to keep memory-only limits per repo
    # convention.
    resources:
      limits:
        cpu: null

    server:
      resources:
        limits:
          cpu: null

      # Upstream already sets the pod to run as 65534 non-root; add the remaining
      # "restricted" requirements on the pod and container.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
