argo-cd:
  redis-ha:
    enabled: true
    haproxy:
      # Recreate one haproxy pod at a time on rollout. The default 25%/25% strategy
      # surges a 4th pod before terminating any old one, but hardAntiAffinity permits
      # only one haproxy per node — with 3 replicas on 3 nodes the surge pod is
      # unschedulable and the rollout deadlocks. maxSurge=0 removes-then-adds instead.
      deploymentStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1

  controller:
    replicas: 1
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argocd
        additionalLabels:
          release: kube-prometheus-stack
        relabelings:
          # Set job label for Alloy integration pattern
          - sourceLabels: [__address__]
            targetLabel: job
            replacement: "integrations/argocd/application-controller"
          - sourceLabels: [__meta_kubernetes_pod_name]
            targetLabel: pod
          - sourceLabels: [__meta_kubernetes_namespace]
            targetLabel: namespace

  configs:
    secret:
      extra:
        webhook.gitlab.secret: "$argocd-gitlab-webhook-secret:webhook.gitlab.secret"
    params:
      # Allow insecure connections since TLS is terminated at the Gateway
      server.insecure: true
    cm:
      url: https://argocd.k8s.home.rottlr.de
      # https://argo-cd.readthedocs.io/en/stable/faq/#how-to-disable-admin-user
      admin.enabled: "false"
      # Dex connector: Dex exchanges the auth code with GitLab, stores the refresh
      # token, and silently reissues ArgoCD tokens without prompting the user again.
      # https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/
      dex.config: |
        connectors:
          - type: gitlab
            id: gitlab
            name: GitLab
            config:
              baseURL: https://gitlab.home.rottlr.de
              clientID: f51225da0eb73be7b929fd654344ae70c1191ed4ecd0c7c1a216f7a5cf2652c7
              # References key 'clientSecret' from Kubernetes secret 'argocd-oidc-gitlab'
              clientSecret: $argocd-oidc-gitlab:clientSecret
              redirectURI: https://argocd.k8s.home.rottlr.de/api/dex/callback
      # Account for Backstage
      accounts.backstage: apiKey
      # Local account for MCP/CLI API token generation; login = ArgoCD CLI auth, apiKey = token generation
      accounts.mcp: login, apiKey
      # Crossplane configuration: https://docs.crossplane.io/latest/guides/crossplane-with-argo-cd/
      application.resourceTrackingMethod: annotation
      resource.customizations: |
        "*.upbound.io/*":
          health.lua: |
            health_status = {
              status = "Progressing",
              message = "Provisioning ..."
            }

            local function contains (table, val)
              for i, v in ipairs(table) do
                if v == val then
                  return true
                end
              end
              return false
            end

            local has_no_status = {
              "ClusterProviderConfig",
              "ProviderConfig",
              "ProviderConfigUsage"
            }

            if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
              health_status.status = "Healthy"
              health_status.message = "Resource is up-to-date."
              return health_status
            end

            if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
              if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status.users ~= nil then
                health_status.status = "Healthy"
                health_status.message = "Resource is in use."
                return health_status
              end
              return health_status
            end

            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "LastAsyncOperation" then
                if condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end
              end

              if condition.type == "Synced" then
                if condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end
              end

              if condition.type == "Ready" then
                if condition.status == "True" then
                  health_status.status = "Healthy"
                  health_status.message = "Resource is up-to-date."
                end
              end
            end

            return health_status

        "*.crossplane.io/*":
          health.lua: |
            health_status = {
              status = "Progressing",
              message = "Provisioning ..."
            }

            local function contains (table, val)
              for i, v in ipairs(table) do
                if v == val then
                  return true
                end
              end
              return false
            end

            local has_no_status = {
              "Composition",
              "CompositionRevision",
              "DeploymentRuntimeConfig",
              "ClusterProviderConfig",
              "ProviderConfig",
              "ProviderConfigUsage"
            }
            if obj.status == nil or next(obj.status) == nil and contains(has_no_status, obj.kind) then
                health_status.status = "Healthy"
                health_status.message = "Resource is up-to-date."
              return health_status
            end

            if obj.status == nil or next(obj.status) == nil or obj.status.conditions == nil then
              if (obj.kind == "ProviderConfig" or obj.kind == "ClusterProviderConfig") and obj.status.users ~= nil then
                health_status.status = "Healthy"
                health_status.message = "Resource is in use."
                return health_status
              end
              return health_status
            end

            for i, condition in ipairs(obj.status.conditions) do
              if condition.type == "LastAsyncOperation" then
                if condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end
              end

              if condition.type == "Synced" then
                if condition.status == "False" then
                  health_status.status = "Degraded"
                  health_status.message = condition.message
                  return health_status
                end
              end

              if contains({"Ready", "Healthy", "Offered", "Established", "ValidPipeline", "RevisionHealthy"}, condition.type) then
                if condition.status == "True" then
                  health_status.status = "Healthy"
                  health_status.message = "Resource is up-to-date."
                end
              end
            end

            return health_status
      resource.exclusions: |
        - apiGroups:
          - "*"
          kinds:
          - ProviderConfigUsage
      # https://kyverno.io/docs/installation/platform-notes/#notes-for-argocd-users
      # https://argo-cd.readthedocs.io/en/stable/user-guide/diffing/#ignoring-rbac-changes-made-by-aggregateroles
      resource.compareoptions: |
        # disables status field diffing in specified resource types
        ignoreAggregatedRoles: true
    rbac:
      # No default access, users must be explicitly granted access to a project.
      policy.default: ""
      policy.csv: |
        g, idp/platform, role:admin
        g, mcp, role:readonly
        p, backstage, applications, get, */*, allow
        p, backstage, clusters, get, *, allow
        p, backstage, repositories, get, *, allow
      # Dex fetches group memberships via the GitLab API and exposes them in 'groups'
      scopes: '[groups]'

  server:
    service:
      # Cilium's Envoy gateway rewrites gRPC-web to native gRPC (grpc_web filter),
      # which requires an HTTP/2 upstream; without h2c the request is downgraded to
      # HTTP/1.1 and argocd-server's web mux answers 404 ("argocd login" breaks).
      # The chart only exposes appProtocol on the https port, so the Gateway API
      # routes in argocd-platform-apps target service port 443. Both ports hit the
      # same plaintext container port 8080 (server.insecure).
      servicePortHttpsAppProtocol: kubernetes.io/h2c
    autoscaling:
      enabled: true
      minReplicas: 2
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "512Mi"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argocd
        additionalLabels:
          release: kube-prometheus-stack
        relabelings:
          # Set job label for Alloy integration pattern
          - sourceLabels: [__address__]
            targetLabel: job
            replacement: "integrations/argocd/argocd-server"
          - sourceLabels: [__meta_kubernetes_pod_name]
            targetLabel: pod
          - sourceLabels: [__meta_kubernetes_namespace]
            targetLabel: namespace

  repoServer:
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 5
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 70
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 100
              periodSeconds: 60
            - type: Pods
              value: 2
              periodSeconds: 60
          selectPolicy: Min
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
        namespace: argocd
        additionalLabels:
          release: kube-prometheus-stack
        relabelings:
          # Set job label for Alloy integration pattern
          - sourceLabels: [__address__]
            targetLabel: job
            replacement: "integrations/argocd/repo-server"
          - sourceLabels: [__meta_kubernetes_pod_name]
            targetLabel: pod
          - sourceLabels: [__meta_kubernetes_namespace]
            targetLabel: namespace

  applicationSet:
    replicas: 2
