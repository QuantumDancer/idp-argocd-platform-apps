# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: {{ .Values.repos.platformApps.repoURL }}
    targetRevision: {{ .Values.repos.platformApps.targetRevision }}
    path: charts/loki
    helm:
      releaseName: loki
      valueFiles:
        - values.yaml
        - environments/{{ .Values.environment }}.yaml
      ignoreMissingValueFiles: true
      {{- if ne .Values.environment "homelab" }}
      parameters:
        - name: loki.loki.storage.s3.region
          value: {{ .Values.awsRegion | quote }}
        - name: loki.loki.storage.bucketNames.chunks
          value: {{ .Values.lokiStorageBucketNameChunks | quote }}
        - name: loki.loki.storage.bucketNames.ruler
          value: {{ .Values.lokiStorageBucketNameRuler | quote }}
      {{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: loki

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Generous retry budget: on a fresh cluster the first syncs race operator
    # CRDs and webhooks, and ArgoCD never re-attempts an automated sync of the
    # same revision once retries are exhausted, so this must outlast bootstrap.
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 10m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
