# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/argoproj.io/application_v1alpha1.json
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-mcp
  namespace: argocd
  annotations:
    # Later than grafana-operator (wave 1) and the grafana instance (wave 4): the
    # GrafanaServiceAccount CR in this chart needs both the operator's CRD and a running
    # Grafana instance to mint its token.
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform

  source:
    repoURL: {{ .Values.repos.platformApps.repoURL }}
    targetRevision: {{ .Values.repos.platformApps.targetRevision }}
    path: charts/grafana-mcp
    helm:
      releaseName: grafana-mcp
      valueFiles:
        - values.yaml
        - environments/{{ .Values.environment }}.yaml

  destination:
    server: https://kubernetes.default.svc
    # Deploys into the grafana namespace: the grafana-operator only creates a
    # GrafanaServiceAccount (and its token secret) in the same namespace as the Grafana
    # instance, and the pod must read that secret from its own namespace.
    namespace: grafana

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
