environment: development

repos:
  platformApps:
    targetRevision: development
  backstage:
    targetRevision: development
  crossplaneCompositions:
    targetRevision: development
  userApps:
    targetRevision: development

# Dex brokers IAM Identity Center SAML -> OIDC for Grafana SSO (AWS only).
dex:
  enabled: true

# Distributed Tempo (Tempo 3) with its Strimzi-managed Kafka write path (AWS only).
strimziKafkaOperator:
  enabled: true
kafka:
  enabled: true
tempoDistributed:
  enabled: true
